name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ollama models (qwen2.5-coder:14b, llama3.2:3b, bge-m3) are too large for CI
# runners, so the tests that need them, and the Qdrant tests that embed with
# bge-m3, skip with a reason. Kafka runs as a service so the live broker tests
# (ordering, the producer stall, durable offset commits, the processor's
# SIGTERM flush and the Kafka round trip) do run.
env:
  KAFKA_BROKERS: localhost:9092

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./... 2>&1 | tee go-test.log
        shell: bash -o pipefail {0}
      - name: Report failing tests as an annotation
        if: failure()
        run: |
          echo "::error title=go test failures::$(grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:|^FAIL|Error' go-test.log | head -60 | awk '{printf "%s%%0A", $0}')"

  python:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.lock
      - name: Install Python dependencies (pinned)
        run: |
          pip install -r python/requirements.lock
          pip install --no-deps -e python
      - name: Build the Go binaries and the offline lakehouse
        run: |
          mkdir -p bin
          go build -o bin/ ./cmd/...
          for f in data/races/session_*_events.jsonl.gz; do ./bin/processor -from-file "$f" -out data/lakehouse; done
      - name: pytest
        working-directory: python
        run: python -m pytest -q -rs -rf 2>&1 | tee ../pytest.log
        shell: bash -o pipefail {0}
      - name: Report failing tests as an annotation
        if: failure()
        run: |
          echo "::error title=pytest failures::$(grep -E '^(FAILED|ERROR) |Error|assert' pytest.log | head -60 | awk '{printf "%s%%0A", $0}')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
      - name: Playwright (recorded payloads; the live test needs the full stack and skips)
        run: |
          npx playwright install --with-deps chromium
          PW_NO_BUILD=1 npx playwright test

  compose:
    # the containerised stack, minus the dashboard image and the Qdrant index job
    # (it embeds with bge-m3 on Ollama, which CI does not have)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the Go and Python images
        run: docker compose build lakehouse api
      - name: Start the stack
        run: docker compose up -d kafka qdrant mcp-sim processor api
      - name: Health checks from the host (ports are published on 127.0.0.1)
        run: |
          set -e
          for url in http://127.0.0.1:8081/healthz http://127.0.0.1:8090/healthz http://127.0.0.1:8090/readyz http://127.0.0.1:8080/healthz; do
            for i in $(seq 1 120); do curl -fs -m 2 "$url" >/dev/null && break; sleep 2; done
            curl -fs -m 2 "$url" >/dev/null || { echo "::error::$url never became healthy"; exit 1; }
            echo "ok $url"
          done
          status=$(curl -fs -m 5 http://127.0.0.1:8080/api/status)
          echo "$status"
          python3 -c "import json,sys; s=json.loads(sys.argv[1]); assert s['mcp_sim'] and s['processor'] and s['qdrant'] and len(s['lakehouse_sessions']) == 3, s" "$status"
          curl -fs -m 10 http://127.0.0.1:8081/mcp -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | python3 -c "import json,sys; assert len(json.load(sys.stdin)['result']['tools']) == 4"
      - name: Report container state and logs as an annotation
        if: failure()
        run: |
          echo "::error title=compose failure::$( (docker compose ps -a; docker compose logs --tail 25) 2>&1 | tail -120 | awk '{printf "%s%%0A", $0}')"
      - name: Tear down
        if: always()
        run: docker compose down -v
