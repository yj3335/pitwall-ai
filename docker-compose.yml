# Full PitWall AI stack in containers. The supported, tested path is the native
# .venv toolchain (make run); this file mirrors it and has not been run on the
# development machine, which has no Docker (docs/OPERATIONS.md).
#
#   docker compose up -d --build          # Kafka, Qdrant, simulator, processor, API, dashboard
#   docker compose --profile replay run --rm replayer -file data/races/session_9165_events.jsonl.gz -speed 20
#
# Ollama stays on the host (GPU / Metal access): run `make ollama-pull` there first.
# Services listen on 0.0.0.0 inside the containers (the bridge network needs it);
# every published port is bound to the host's loopback only.
name: pitwall

x-python: &python
  build: { context: ., dockerfile: docker/python.Dockerfile }
  image: pitwall-python
  environment:
    OLLAMA_URL: http://host.docker.internal:11434
    QDRANT_URL: http://qdrant:6333
    PITWALL_MCP_URL: http://mcp-sim:8081/mcp
    PITWALL_PROCESSOR_URL: http://processor:8090
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - ./data:/app/data
    - fastembed-cache:/cache/fastembed

x-go: &go
  build: { context: ., dockerfile: docker/go.Dockerfile }
  image: pitwall-go
  volumes: ["./data:/app/data"]

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 20
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 6
    ports: ["127.0.0.1:29092:29092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-topics:
    image: apache/kafka:4.0.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in f1.telemetry.raw:20 f1.race_control:1 f1.triggers:20; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  # One-shot jobs: the deterministic offline lakehouse (make lakehouse) and the
  # hybrid index over the FIA corpus (make index).
  lakehouse:
    <<: *go
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rm -rf data/lakehouse/telemetry data/lakehouse/laps data/lakehouse/triggers
        for f in data/races/session_*_events.jsonl.gz; do processor -from-file "$$f" -out data/lakehouse; done

  # embeds the corpus with bge-m3 on the host's Ollama; the API does not wait for
  # it (retrieval is unavailable until it has run once)
  index:
    <<: *python
    depends_on: { qdrant: { condition: service_started } }
    command: ["python", "-m", "pitwall.rag.indexer"]

  mcp-sim:
    <<: *go
    depends_on: { kafka-topics: { condition: service_completed_successfully } }
    command: ["mcp-sim", "-http", "0.0.0.0:8081", "-brokers", "kafka:9092", "-quiet"]
    ports: ["127.0.0.1:8081:8081"]
    healthcheck: { test: ["CMD", "curl", "-fs", "localhost:8081/healthz"], interval: 5s, retries: 20 }

  processor:
    <<: *go
    depends_on: { kafka-topics: { condition: service_completed_successfully } }
    command: ["processor", "-brokers", "kafka:9092", "-out", "data/lakehouse_live", "-http", "0.0.0.0:8090"]
    ports: ["127.0.0.1:8090:8090"]
    stop_grace_period: 20s
    healthcheck: { test: ["CMD", "curl", "-fs", "localhost:8090/readyz"], interval: 5s, retries: 30 }

  api:
    <<: *python
    depends_on:
      lakehouse: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
      mcp-sim: { condition: service_healthy }
      processor: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

  replayer:
    <<: *go
    profiles: [replay]
    depends_on: { kafka-topics: { condition: service_completed_successfully } }
    entrypoint: ["replayer", "-brokers", "kafka:9092"]

volumes:
  kafka-data:
  qdrant-data:
  fastembed-cache:
