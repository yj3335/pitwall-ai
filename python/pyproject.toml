[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "PitWall AI: OLAP, hybrid RAG, MCP client, LangGraph strategy agent and API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pitwall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs live Qdrant / Ollama / MCP server",
]
